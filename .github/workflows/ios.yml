name: ios-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成 Xcode 工程（xcodegen）
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: 构建（未签名，iPhone 真机 SDK）
        run: |
          cd ios
          xcodebuild -project Sybot.xcodeproj -scheme Sybot -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA
        run: |
          APP=$(find ios/build/Build/Products -type d -name "Sybot.app" | head -n 1)
          test -n "$APP"
          mkdir -p stage/Payload
          cp -R "$APP" stage/Payload/
          cd stage
          zip -qry ../Sybot-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Sybot-unsigned-ipa
          path: Sybot-unsigned.ipa
          retention-days: 30
